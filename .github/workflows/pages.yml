# Publish the starred gallery to GitHub Pages.
#
# Deploying via Actions rather than "deploy from a branch" because that setting
# only ever offers / (root) and /docs, and the site artwall builds lives in
# public/. Here the directory is just a parameter.
#
# Nothing is built: public/ is already a complete static site (relative paths, no
# JavaScript), so this only uploads it. artwall rewrites public/ locally on every
# star; committing and pushing is what makes that live.
name: Deploy gallery to Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: these are cheap and
# in-order, and a half-deployed gallery is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
